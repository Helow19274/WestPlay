name: Windows installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install Rust stable (MSVC x64)
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update

      - name: Select Rust toolchain
        run: rustup default stable-x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # The root postinstall runs npm install in ui; install both lockfiles explicitly instead.
      - name: Install Tauri CLI
        run: npm ci --ignore-scripts

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build game plugin
        run: cargo build --locked --release -p westplay-plugin

      - name: Prepare installer configuration
        run: |
          # Keep the release resources and NSIS hooks, but do not require updater signing secrets.
          $config = Get-Content app/tauri.release.conf.json -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 100 | Set-Content "$env:RUNNER_TEMP/tauri-ci.conf.json" -Encoding utf8

      - name: Build NSIS installer
        working-directory: app
        # Invoke the installed CLI directly: the root prebuild references a local-only sweep script.
        run: node ../node_modules/@tauri-apps/cli/tauri.js build --ci --config "$env:RUNNER_TEMP/tauri-ci.conf.json" --bundles nsis -- --locked

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: WestPlay-windows-x64-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
